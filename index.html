<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garimpo Sound — acervo de vinis, CDs e fitas</title>
<meta name="theme-color" content="#12100c">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' data: blob: https://musicbrainz.org https://coverartarchive.org https://*.archive.org; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Catalogue seus vinis, CDs e fitas, ache qualquer música da sua coleção e monte setlists.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garimpo Sound">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Fontes gratuitas (opcional): sem internet o app usa fontes do sistema com o mesmo estilo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Limelight&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#12100c; --bg2:#1a1610; --surf:#211b13; --surf2:#2b2318;
  --gold:#d4af61; --gold-hi:#f0d78f; --gold-deep:#8f6f2f;
  --paper:#eadfc6; --muted:#a69a82; --line:rgba(212,175,97,.30); --hair:rgba(212,175,97,.14);
  --red:#d2634d; --teal:#7fb8ae; --rust:#d0794b;
  --disp:'Limelight','Bodoni 72','Didot','Playfair Display',Georgia,serif;
  --ui:'Jost','Futura','Avenir Next','Century Gothic',system-ui,sans-serif;
  --c:12px;
  --nav:68px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--paper);font:400 16px/1.45 var(--ui);min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .83  0 0 0 0 .69  0 0 0 0 .38  0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{display:block;flex:none}

/* ---------- Marca ---------- */
.brand{position:relative;height:96px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;text-align:center}
.brand svg.fan{position:absolute;inset:0;width:100%;height:100%}
.wordmark{position:relative;font-family:var(--disp);font-size:30px;line-height:1.1;letter-spacing:.05em;white-space:nowrap;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{position:relative;font-size:13px;color:var(--muted);letter-spacing:.06em}
.rule{display:flex;align-items:center;gap:10px;max-width:880px;margin:0 auto;padding:0 20px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-deep))}
.rule::after{transform:scaleX(-1)}
.rule i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold)}

/* ---------- Páginas ---------- */
#main{max-width:880px;margin:0 auto;padding:18px 18px calc(var(--nav) + 36px + env(safe-area-inset-bottom))}
.pg h1{font-family:var(--disp);font-weight:400;font-size:26px;line-height:1.15;color:var(--paper)}
.pg h2{font-family:var(--disp);font-weight:400;font-size:18px;color:var(--gold);margin:26px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 16px;max-width:60ch}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin:0 -18px 14px;padding-inline:18px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:2px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--paper);background:var(--bg2)}
.chip[aria-pressed=true]{background:var(--gold);color:#17120a;border-color:var(--gold);font-weight:600}
select.sel{min-height:38px;background:var(--bg2);border:1px solid var(--line);border-radius:2px;padding:0 10px;font-size:14px}

/* ---------- Molduras art déco ---------- */
.frame{--c:12px;position:relative;padding:1.5px;background:linear-gradient(135deg,var(--gold-hi),var(--gold-deep) 55%,var(--gold));
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
.frame .cover{clip-path:polygon(calc(var(--c) - 1px) 0,calc(100% - var(--c) + 1px) 0,100% calc(var(--c) - 1px),100% calc(100% - var(--c) + 1px),calc(100% - var(--c) + 1px) 100%,calc(var(--c) - 1px) 100%,0 calc(100% - var(--c) + 1px),0 calc(var(--c) - 1px))}
.cover{position:relative;aspect-ratio:1;background:var(--surf);overflow:hidden;display:block;width:100%}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.ph{background:repeating-conic-gradient(from 0deg at 50% 118%,rgba(212,175,97,.16) 0 5deg,transparent 5deg 10deg),radial-gradient(circle at 50% 118%,var(--surf2),var(--bg2) 70%)}
.cover.ph .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:clamp(40px,12vw,64px);color:var(--fc);opacity:.92}

/* ---------- Grade de capas ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 18px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:block;text-align:left;width:100%}
.card .top{position:relative}
.fbadge{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(18,16,12,.88);border:1px solid var(--fc);color:var(--fc);display:grid;place-items:center;z-index:2}
.sticker{position:absolute;right:-7px;bottom:-11px;z-index:3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 60%,var(--gold-deep));color:#17120a;font-weight:700;font-size:12px;letter-spacing:-.02em;
  transform:rotate(-10deg);box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 0 0 2px rgba(18,16,12,.0),inset 0 0 0 3px rgba(18,16,12,.0);}
.sticker::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed rgba(18,16,12,.5)}
.card .meta{padding:14px 2px 0;display:grid;gap:1px}
.card .al{font-weight:500;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ar{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .yr{font-size:12px;color:var(--gold-deep)}

/* ---------- Vazio ---------- */
.empty{text-align:center;padding:36px 14px 10px;display:grid;justify-items:center;gap:14px}
.empty .fan{width:150px;height:76px}
.empty h2{margin:0;color:var(--paper)}
.empty p{color:var(--muted);max-width:34ch}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- Botões ---------- */
.btn{--c:9px;min-height:46px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;color:#17120a;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#bf9a4c);
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% 50%,calc(100% - var(--c)) 100%,var(--c) 100%,0 50%);padding-inline:26px}
.btn.ghost{background:none;color:var(--gold);clip-path:none;border:1px solid var(--gold);border-radius:2px;padding-inline:18px}
.btn.danger{background:none;color:var(--red);clip-path:none;border:1px solid var(--red);border-radius:2px;padding-inline:18px}
.btn:active{filter:brightness(.92)}
.icon{width:44px;height:44px;display:grid;place-items:center;color:var(--gold);border-radius:2px}
.icon.sm{width:40px;height:40px}

/* ---------- Busca ---------- */
.search{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--gold);padding:6px 2px;margin-bottom:16px;color:var(--gold)}
.search input{flex:1;background:none;border:0;outline:0;font-size:18px;min-height:40px;color:var(--paper);min-width:0}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{filter:sepia(1) saturate(4) brightness(.9);height:18px;width:18px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left}
.row .th{width:54px;flex:none}
.row .th .frame{--c:7px}
.row .tx{flex:1;min-width:0;display:grid}
.row .t1{font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{flex:none;display:grid;justify-items:end;gap:2px;font-size:12px;color:var(--muted)}
.row .end svg{color:var(--fc)}
.pos{font-weight:600;color:var(--gold)}
mark{background:none;color:var(--gold-hi);font-weight:600;text-decoration:underline;text-decoration-color:var(--gold-deep);text-underline-offset:3px}
.note{color:var(--muted);font-size:14px}
.dice{margin:8px 0 0}

/* ---------- Setlist ---------- */
.panel-box{border:1px solid var(--line);padding:16px;background:var(--bg2);margin:6px 0 16px;display:grid;gap:16px}
.lbl{font-size:13px;color:var(--gold);margin-bottom:8px;display:block}
input[type=range]{width:100%;accent-color:var(--gold);min-height:34px}
.cnt{font-family:var(--disp);font-size:24px;color:var(--paper)}
.set{list-style:none;counter-reset:s}
.set li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.set .n{font-family:var(--disp);color:var(--gold);width:30px;text-align:right;flex:none;font-size:18px}
.set .tx{flex:1;min-width:0;display:grid}
.set .t1{font-weight:500;line-height:1.3}
.set .t2{font-size:13px;color:var(--muted)}
.set .loc{font-size:12px;color:var(--gold-deep)}
.pull{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.pull .mini{flex:none;width:64px}
.pull .mini .frame{--c:7px}
.pull .mini span{display:block;font-size:11px;color:var(--muted);line-height:1.2;margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- Navegação ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--bg2);box-shadow:0 -1px 0 var(--gold-deep),0 -4px 0 var(--bg2),0 -5px 0 rgba(212,175,97,.35);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr}
nav.tabs button{display:grid;justify-items:center;align-content:center;gap:3px;font-size:12px;color:var(--muted);min-height:var(--nav)}
nav.tabs button[aria-current=page]{color:var(--gold-hi)}
nav.tabs button[aria-current=page] svg{filter:drop-shadow(0 0 6px rgba(212,175,97,.45))}
nav.tabs .add{position:relative}
nav.tabs .add span.disc{position:absolute;left:50%;top:-22px;width:62px;height:62px;margin-left:-31px;border-radius:50%;display:grid;place-items:center;color:#17120a;
  background:repeating-conic-gradient(from 0deg,rgba(18,16,12,.16) 0 6deg,transparent 6deg 12deg),radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 60%,var(--gold-deep));
  box-shadow:0 0 0 4px var(--bg2),0 0 0 5px var(--gold-deep)}
nav.tabs .add b{font-weight:500;position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--gold)}

/* ---------- Folhas (detalhe / formulário / menu) ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(8,6,4,.78)}
.sheet[hidden]{display:none}
.panel{position:absolute;inset:0;max-width:640px;margin:0 auto;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:up .22s ease-out;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.shtop{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--bg);box-shadow:0 1px 0 var(--gold-deep)}
.shtop h2{font-family:var(--disp);font-weight:400;font-size:18px;text-align:center;color:var(--gold)}
.shbody{padding:20px 18px}

.hero{display:grid;justify-items:center;gap:20px;margin-bottom:6px}
.hero .frame{width:min(78vw,300px);--c:18px}
.hero .ttl{text-align:center;display:grid;gap:4px}
.hero h1{font-family:var(--disp);font-weight:400;font-size:27px;line-height:1.15}
.hero .by{font-size:18px;color:var(--gold)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hair);border:1px solid var(--hair);margin:20px 0}
.facts div{background:var(--bg);padding:12px 14px;display:grid;gap:2px}
.facts small{color:var(--muted);font-size:12px}
.facts b{font-weight:500}
.tag{position:relative;display:inline-block;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#17120a;font-weight:700;padding:6px 14px 6px 26px;clip-path:polygon(0 50%,13px 0,100% 0,100% 100%,13px 100%)}
.tag::before{content:"";position:absolute;left:11px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--bg)}
.tracks{list-style:none}
.tracks li{display:flex;gap:12px;padding:10px 6px;border-bottom:1px solid var(--hair);align-items:baseline}
.tracks li.hl{background:rgba(212,175,97,.12);box-shadow:inset 3px 0 0 var(--gold)}
.tracks .pos{width:34px;flex:none;text-align:right;font-size:14px}
.tracks .side{padding:16px 6px 6px;color:var(--gold);font-family:var(--disp);font-size:15px;border:0}
.acts{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}

.fld{display:grid;gap:6px;margin-bottom:18px}
.fld>label,.fld>.lbl{font-size:13px;color:var(--gold)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:2px;padding:12px;min-height:48px;font-size:16px}
.fld textarea{min-height:170px;line-height:1.55;resize:vertical}
.fld .hint{font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{display:grid;justify-items:center;gap:4px;padding:12px 6px;border:1px solid var(--line);border-radius:2px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{border-color:var(--fc);color:var(--fc);background:rgba(255,255,255,.04);font-weight:600}
.photo{display:grid;justify-items:center;gap:14px;margin-bottom:22px}
.photo .frame{width:min(66vw,250px);--c:16px}
.photo .drop{aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:18px;background:repeating-conic-gradient(from 0deg at 50% 118%,rgba(212,175,97,.10) 0 5deg,transparent 5deg 10deg),var(--bg2);color:var(--muted);font-size:14px}
.photo .btnrow{gap:8px}
.addg{display:flex;gap:8px;margin-top:8px}
.addg input{flex:1;min-height:42px;padding:8px 12px}

.dlg{z-index:70;display:grid;place-items:center;padding:20px}
.dlg .box{background:var(--bg2);border:1px solid var(--gold);padding:22px;max-width:420px;width:100%;display:grid;gap:16px;box-shadow:0 0 0 4px var(--bg2),0 0 0 5px var(--gold-deep)}
.dlg .box p{font-size:16px}
.dlg .box input{background:var(--surf);border:1px solid var(--line);border-radius:2px;padding:12px;min-height:46px;font-size:16px;width:100%}
.dlg .acts{margin:0}
.auto{border:1px solid var(--line);border-left:3px solid var(--gold);background:var(--bg2);padding:16px;margin:2px 0 22px;display:grid;gap:12px}
.auto h3{font-family:var(--disp);font-weight:400;font-size:17px;color:var(--gold);display:flex;gap:8px;align-items:center}
.auto .hint{font-size:12.5px;color:var(--muted)}
.auto .btn{width:100%}
.bc{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.bc input{min-width:0;background:var(--surf);border:1px solid var(--line);border-radius:2px;padding:10px 12px;min-height:46px;font-size:16px}
.bc .btn{width:auto;padding-inline:16px}
.scan{z-index:75;background:#000}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf{position:absolute;left:8%;right:8%;top:32%;height:24%;border:2px solid var(--gold);box-shadow:0 0 0 100vmax rgba(8,6,4,.62)}
.vf::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--gold-hi);box-shadow:0 0 8px var(--gold)}
.scan-ui{position:absolute;left:0;right:0;bottom:calc(32px + env(safe-area-inset-bottom));display:grid;justify-items:center;gap:14px;color:var(--paper);text-shadow:0 1px 4px #000}
.scan-ui .btn.ghost{background:rgba(18,16,12,.8)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--gold);color:#17120a;font-weight:600;font-size:14px;padding:10px 20px;max-width:88vw;text-align:center;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%)}
.toast[hidden]{display:none}
.menu-list{display:grid;gap:10px}
.menu-list .btn{justify-content:flex-start;width:100%}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair);margin-bottom:22px}
.stat div{background:var(--bg);padding:14px 10px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:22px;color:var(--gold-hi)}
.stat small{color:var(--muted);font-size:12px}
.fine{font-size:13px;color:var(--muted);margin-top:18px;max-width:52ch}
</style>
</head>
<body>

<header>
  <div class="brand" id="brand">
    <div class="wordmark">Garimpo Sound</div>
    <div class="tagline">seu acervo de vinis, CDs e fitas</div>
  </div>
  <div class="rule" aria-hidden="true"><i></i></div>
</header>

<main id="main"></main>

<nav class="tabs" aria-label="Navegação principal">
  <button data-a="nav" data-v="caixa" id="t-caixa"></button>
  <button data-a="nav" data-v="garimpar" id="t-garimpar"></button>
  <button class="add" data-a="new" aria-label="Novo achado"><span class="disc" id="t-add"></span><b>Achado</b></button>
  <button data-a="nav" data-v="setlist" id="t-setlist"></button>
  <button data-a="menu" id="t-mais"></button>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="panel" id="panel"></div></div>
<div class="sheet dlg" id="dlg" hidden></div>
<div class="sheet scan" id="scan" hidden role="dialog" aria-modal="true" aria-label="Escanear código de barras">
  <video id="scanv" playsinline muted></video>
  <div class="vf" aria-hidden="true"></div>
  <div class="scan-ui"><p>Aponte a câmera para o código de barras, na traseira da capa</p><button class="btn ghost" data-a="scanclose">Cancelar</button></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
'use strict';
/* =====================================================================
   Garimpo Sound — catálogo de vinis, CDs e fitas (PWA)
   Dados ficam no aparelho (IndexedDB). Nada é enviado a servidor algum.
   ===================================================================== */

// ---------- utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// leque art déco (cabeçalho e estado vazio)
function fanSVG(w, h, rays, opacity) {
  const cx = w / 2, cy = h + 6, L = Math.hypot(w, h) * 0.75;
  let s = `<svg class="fan" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMax slice" aria-hidden="true">`;
  for (let i = 0; i <= rays; i++) {
    const a = Math.PI + (Math.PI * i / rays);
    s += `<line x1="${cx}" y1="${cy}" x2="${(cx + L * Math.cos(a)).toFixed(1)}" y2="${(cy + L * Math.sin(a)).toFixed(1)}" stroke="#d4af61" stroke-opacity="${i % 2 ? opacity * .55 : opacity}" stroke-width="1"/>`;
  }
  for (const r of [h * .38, h * .62, h * .86]) s += `<path d="M${cx - r} ${cy} A${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="#8f6f2f" stroke-opacity=".75" stroke-width="1"/>`;
  return s + '</svg>';
}

// ---------- armazenamento (IndexedDB) ----------
const DB = (() => {
  let db = null, broken = false;
  const open = () => new Promise(res => {
    try {
      const r = indexedDB.open('garimpo', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('items', {keyPath:'id'}); d.createObjectStore('setlists', {keyPath:'id'}); };
      r.onsuccess = () => { db = r.result; res(true); };
      r.onerror = () => { broken = true; res(false); };
    } catch (e) { broken = true; res(false); }
  });
  const run = (store, mode, fn) => new Promise((res, rej) => {
    if (broken || !db) return res(mode === 'readonly' ? [] : undefined);
    const t = db.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
  return {
    open,
    get broken() { return broken; },
    all: s => run(s, 'readonly', st => st.getAll()),
    put: (s, v) => run(s, 'readwrite', st => st.put(v)),
    del: (s, id) => run(s, 'readwrite', st => st.delete(id)),
    clear: s => run(s, 'readwrite', st => st.clear())
  };
})();

// ---------- fotos ----------
const urlCache = new Map();
function photoURL(it) {
  if (!it.photo) return null;
  let u = urlCache.get(it.id);
  if (!u || u.blob !== it.photo) {
    if (u) URL.revokeObjectURL(u.url);
    u = {blob: it.photo, url: URL.createObjectURL(it.photo)};
    urlCache.set(it.id, u);
  }
  return u.url;
}
async function resizeImage(file, max = 900) {
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch (e) {
    bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(b => r(b), 'image/jpeg', .82));
}

// ---------- faixas ----------
function parseTracks(text) {
  return String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map((l, i) => {
    const m = l.match(/^(?:([A-Da-d]\d{1,2})[.)\-–:\s]+|(\d{1,3})\s*[.)\-–:]\s*)(.+)$/);
    if (m) return {pos: (m[1] || m[2]).toUpperCase(), t: m[3].trim()};
    return {pos: String(i + 1), t: l};
  });
}
const tracksToText = tr => (tr || []).map(x => /^\d+$/.test(x.pos) ? `${x.pos}. ${x.t}` : `${x.pos} ${x.t}`).join('\n');

// ---------- realce de busca ----------
function hl(text, tokens) {
  text = String(text ?? '');
  if (!tokens.length) return esc(text);
  let n = '', map = [];
  for (let i = 0; i < text.length; i++) { const f = fold(text[i]); for (let k = 0; k < f.length; k++) { n += f[k]; map.push(i); } }
  const flag = new Array(text.length).fill(false);
  for (const tk of tokens) { let from = 0, idx; while ((idx = n.indexOf(tk, from)) > -1) { for (let k = idx; k < idx + tk.length; k++) flag[map[k]] = true; from = idx + tk.length; } }
  let out = '', open = false;
  for (let i = 0; i < text.length; i++) {
    if (flag[i] && !open) { out += '<mark>'; open = true; }
    if (!flag[i] && open) { out += '</mark>'; open = false; }
    out += esc(text[i]);
  }
  return out + (open ? '</mark>' : '');
}

      <div class="acts"><button class="btn ${danger ? 'danger' : ''}" data-d="ok">${esc(ok)}</button><button class="btn ghost" data-d="no">Cancelar</button></div></div>`;
    d.hidden = false;
    const fin = v => { d.hidden = true; d.innerHTML = ''; d.onclick = null; res(v); };

      const b = e.target.closest('[data-d]');

  });
}

function itemMatchesFilters(i) {
  return (state.sFormat === 'todos' || i.format === state.sFormat) && (!state.sGenre || i.genres.includes(state.sGenre));
}
function albumRow(it, tokens) {
  const f = FORMATS[it.format];
  return `<button class="row" data-a="open" data-id="${esc(it.id)}" style="--fc:${f.color}">
    <div class="th"><div class="frame">${cover(it)}</div></div>
    <div class="tx"><span class="t1">${hl(it.album, tokens)}</span><span class="t2">${hl(it.artist, tokens)}${it.year ? ', ' + it.year : ''}</span></div>
    <div class="end">${ic(it.format, 18)}<span>${f.name}${it.location ? '' : ''}</span></div></button>`;
}
function renderResults() {
  const el = $('#results'); if (!el) return;
  if (!state.items.length) { el.innerHTML = emptyHTML(); return; }
  const tokens = norm(state.q).split(/\s+/).filter(Boolean);
  const items = state.items.filter(itemMatchesFilters);
  const filtering = state.sFormat !== 'todos' || state.sGenre;

  if (!tokens.length) {
    const nt = state.items.reduce((a, i) => a + i.tracks.length, 0);
    let h = `<p class="note">Sua biblioteca já tem ${nt} ${nt === 1 ? 'música' : 'músicas'} em ${state.items.length} ${state.items.length === 1 ? 'achado' : 'achados'}. O que vamos procurar?</p>
      <div class="dice"><button class="btn ghost" data-a="rand">${ic('dado', 20)}Surpreenda-me: puxar um disco da caixa</button></div>`;
    if (filtering) h += `<h2>${items.length} ${items.length === 1 ? 'achado' : 'achados'} nesse filtro</h2>` + (items.map(i => albumRow(i, [])).join('') || '<p class="note">Nada por aqui ainda.</p>');
    el.innerHTML = h; return;
  }

  const hit = (hay, tks) => tks.every(t => hay.includes(t));
  const albums = items.filter(i => hit(norm([i.album, i.artist, i.year, i.genres.join(' '), i.location].join(' ')), tokens));
  const artistMap = new Map();
  items.forEach(i => { if (hit(norm(i.artist), tokens)) artistMap.set(i.artist, (artistMap.get(i.artist) || 0) + 1); });
  const tracks = [];
  items.forEach(i => i.tracks.forEach((tr, idx) => {
    const hay = tokens.length > 1 ? norm(tr.t + ' ' + i.artist + ' ' + i.album) : norm(tr.t);
    if (hit(hay, tokens)) tracks.push({i, tr, idx});
  }));

  if (!albums.length && !artistMap.size && !tracks.length) {
    el.innerHTML = `<p class="note">Não encontrei “${esc(state.q)}” na sua caixa. Confira a grafia ou tire os filtros. Se esse disco ainda não foi catalogado, é só registrar o achado.</p>`; return;
  }
  let h = '';
  if (artistMap.size) h += `<h2>Artistas</h2>` + [...artistMap].map(([a, c]) =>
    `<button class="row" data-a="setq" data-v="${esc(a)}"><div class="tx"><span class="t1">${hl(a, tokens)}</span><span class="t2">${c} ${c === 1 ? 'achado' : 'achados'} na sua caixa</span></div></button>`).join('');
  if (albums.length) h += `<h2>Álbuns</h2>` + albums.map(i => albumRow(i, tokens)).join('');
  if (tracks.length) {
    h += `<h2>Músicas</h2>` + tracks.slice(0, 80).map(({i, tr, idx}) => `
      <button class="row" data-a="open" data-id="${esc(i.id)}" data-hl="${idx}" style="--fc:${FORMATS[i.format].color}">
        <div class="tx"><span class="t1">${hl(tr.t, tokens)}</span><span class="t2">${esc(i.artist)}, ${esc(i.album)}</span></div>
        <div class="end">${ic(i.format, 18)}<span><span class="pos">${esc(tr.pos)}</span>${i.location ? ' · ' + esc(i.location) : ''}</span></div></button>`).join('');
    if (tracks.length > 80) h += `<p class="note">Mostrando 80 de ${tracks.length} músicas. Digite mais um pedaço do nome para afinar a busca.</p>`;
  }
  el.innerHTML = h;
}

    const items = data.items.slice(0, 5000).map(cleanItem).filter(Boolean);

      const k = state.items.findIndex(x => x.id === it.id); if (k >= 0) state.items[k] = it; else state.items.push(it);
    }
    for (const l of lists) { await DB.put('setlists', l); const k = state.setlists.findIndex(x => x.id === l.id); if (k >= 0) state.setlists[k] = l; else state.setlists.push(l); }

  if (/vinyl/i.test(f)) return 'vinil';
  if (/cd/i.test(f)) return 'cd';
  return null;
}
const GMAP = [[/bossa/i,'Bossa Nova'],[/samba|pagode/i,'Samba'],[/\bmpb\b|brazilian popular/i,'MPB'],[/forr[oó]/i,'Forró'],[/hip.?hop|\brap\b/i,'Hip hop'],
  [/electro|house|techno|ambient|trance/i,'Eletrônica'],[/classical|opera|baroque/i,'Clássica'],[/metal/i,'Metal'],[/punk/i,'Punk'],[/rock/i,'Rock'],
  [/jazz|bebop/i,'Jazz'],[/blues/i,'Blues'],[/soul|r&b|rhythm and blues/i,'Soul'],[/funk/i,'Funk'],[/disco/i,'Disco'],[/reggae|\bska\b/i,'Reggae'],
  [/country/i,'Country'],[/folk/i,'Folk'],[/gospel/i,'Gospel'],[/pop/i,'Pop']];
function mapGenres(names) {
  const out = [];
  for (const n of names) {
    const hit = GMAP.find(([re]) => re.test(n));
    const g = hit ? hit[1] : n.charAt(0).toUpperCase() + n.slice(1);
    if (!out.includes(g)) out.push(g);
    if (out.length >= 4) break;
  }
  return out;
}
function mbTracks(media) {
  const out = []; let n = 0;
  (media || []).forEach(m => (m.tracks || []).forEach(t => {
    n++;
    const num = String(t.number || '');
    const pos = /^[A-Da-d]\d{1,2}$/.test(num) ? num.toUpperCase() : String(n);
    const title = String(t.title || (t.recording && t.recording.title) || '').trim();
    if (title) out.push({pos, t: title.slice(0, 200)});
  }));
  return out.slice(0, 300);
}
const mbMsg = html => { const b = $('#mbres'); if (b) b.innerHTML = html; };
function mbRender() {
  if (!mbList.length) return mbMsg('<p class="note">Não encontrei esse disco na base. Tente só o nome do artista, outra grafia ou o código de barras. Discos raros às vezes não estão lá: nesse caso, é só preencher à mão.</p>');
  mbMsg(`<span class="lbl">${mbList.length} ${mbList.length === 1 ? 'edição encontrada' : 'edições encontradas'}. Toque na que for igual à sua:</span>` +
    mbList.map((r, i) => `<button type="button" class="row" data-a="mbpick" data-i="${i}" style="--fc:${r.fmt ? FORMATS[r.fmt].color : 'var(--gold)'}">
      <div class="tx"><span class="t1">${esc(r.title)}</span><span class="t2">${esc([r.artist, r.date, r.country, r.label].filter(Boolean).join(', '))}</span></div>
      <div class="end">${r.fmt ? ic(r.fmt, 18) : ''}<span>${r.n ? r.n + ' faixas' : ''}</span></div></button>`).join(''));
}
async function mbSearch(query, auto = false) {
  if (!navigator.onLine) return mbMsg('<p class="note">Sem internet no momento. Você pode preencher à mão e buscar depois, quando estiver online.</p>');
  mbMsg('<p class="note">Procurando seu disco…</p>');
  try {
    const data = await mb(`release/?query=${encodeURIComponent(query)}&limit=20`);
    const pref = draft && draft.format;
    mbList = (data.releases || []).map(r => ({
      id: r.id, rg: r['release-group'] && r['release-group'].id, title: r.title || '', artist: acName(r['artist-credit']),
      date: String(r.date || '').slice(0, 4), country: r.country || '',
      label: ((r['label-info'] || []).map(l => l.label && l.label.name).filter(Boolean)[0]) || '',
      fmt: mbFormat(r.media), n: r['track-count'] || 0, score: r.score || 0
    })).filter(r => r.id && r.title);
    mbList.sort((a, b) => ((b.fmt === pref) - (a.fmt === pref)) || b.score - a.score);
    mbList = mbList.slice(0, 12);
    if (auto && mbList.length === 1) return mbPick(0);
    mbRender();
  } catch (e) {
    mbMsg(`<p class="note">${e.message === 'limite' ? 'A base pediu uma pausa. Espere alguns segundos e tente de novo.' : 'A internet falhou agora. Tente de novo ou preencha à mão.'}</p>`);
  }
}
async function bcSearch(raw) {
  const code = String(raw || '').replace(/\D/g, '');
  if (!/^\d{8,14}$/.test(code)) return toast('O código de barras tem de 8 a 14 números. Confira e tente de novo.');
  const v = [code]; if (code.length === 12) v.push('0' + code); if (code.length === 13 && code[0] === '0') v.push(code.slice(1));
  await mbSearch(`barcode:(${v.join(' OR ')})`, true);
}
async function fetchCover(id) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(`https://coverartarchive.org/release/${encodeURIComponent(id)}/front-500`, {signal: ctl.signal, credentials: 'omit', referrerPolicy: 'no-referrer'});
    if (!r.ok) return null;
    const b = await r.blob();
    return /^image\//.test(b.type) && b.size < 3e6 ? b : null;
  } catch (e) { return null; } finally { clearTimeout(t); }
}
function addGenre(g) {
  g = String(g || '').trim().slice(0, 30); if (!g) return;
  const ex = [...document.querySelectorAll('#gbox [data-v]')].find(b => norm(b.dataset.v) === norm(g));
  if (ex) { if (ex.getAttribute('aria-pressed') !== 'true') ex.click(); }
  else {
    if (!draft.genres.includes(g)) draft.genres.push(g);
    $('#gbox').insertAdjacentHTML('beforeend', `<button type="button" class="chip" data-a="fgenre" data-v="${esc(g)}" aria-pressed="true">${esc(g)}</button>`);
  }
}
async function applyRelease(m) {
  if (!draft || !$('#f')) return;
  const set = (sel, v) => { const e = $(sel); if (e) e.value = v; };
  set('#f-artist', m.artist); set('#f-album', m.album);
  if (/^\d{4}$/.test(m.year)) set('#f-year', m.year);
  if (m.format) { draft.format = m.format; document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === m.format)); }
  m.genres.forEach(addGenre);
  if (m.tracks.length) {
    const ta = $('#f-tracks');
    if (!ta.value.trim() || await dialog({msg: 'Substituir as faixas digitadas pela lista encontrada?', ok: 'Substituir'})) ta.value = tracksToText(m.tracks);
  }
  const nt = $('#f-notes'); if (m.label && !nt.value.trim()) nt.value = 'Gravadora: ' + m.label;
  let capa = false;
  if (!draft.photo) { const b = await fetchCover(m.id); if (b && draft) { draft.photo = b; $('#photoArea').innerHTML = photoAreaHTML(); capa = true; } }
  toast(capa ? 'Achei! Dados e capa preenchidos' : 'Achei! Dados preenchidos');
}
async function mbPick(i) {
  const r = mbList[i]; if (!r) return;
  mbMsg('<p class="note">Buscando as faixas…</p>');
  try {
    const rel = await mb(`release/${encodeURIComponent(r.id)}?inc=recordings+artist-credits+labels+release-groups`);
    let genres = [];
    const rgid = (rel['release-group'] && rel['release-group'].id) || r.rg;
    if (rgid) { try { const g = await mb(`release-group/${encodeURIComponent(rgid)}?inc=genres`); genres = (g.genres || []).sort((a, b) => (b.count || 0) - (a.count || 0)).map(x => x.name); } catch (e) {} }
    const label = ((rel['label-info'] || []).map(l => l.label && l.label.name).filter(Boolean)[0]) || r.label;
    await applyRelease({
      id: rel.id || r.id, artist: acName(rel['artist-credit']) || r.artist, album: rel.title || r.title,
      year: String(rel.date || r.date || '').slice(0, 4), format: mbFormat(rel.media) || r.fmt,
      genres: mapGenres(genres), tracks: mbTracks(rel.media), label
    });
    mbMsg('<p class="note">Pronto! Confira os campos abaixo e guarde o achado.</p>');
  } catch (e) {
    mbRender(); toast(e.message === 'limite' ? 'Espere alguns segundos e tente de novo' : 'Não consegui carregar esse disco. Toque nele de novo.');
  }
}
async function detectBarcode(src) {
  if (!HAS_BD) return null;
  let det;
  try { det = new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e']}); }
  catch (e) { try { det = new BarcodeDetector(); } catch (e2) { return null; } }
  try { const r = await det.detect(src); const c = r.find(x => /^\d{8,14}$/.test(x.rawValue || '')); return c ? c.rawValue : null; }
  catch (e) { return null; }
}
async function startScan() {
  if (!HAS_BD) return toast('Este navegador não lê código de barras: digite os números.');
  const ov = $('#scan'), v = $('#scanv');
  try { scanStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}}, audio: false}); }
  catch (e) { return toast('Libere a câmera para escanear o código de barras.'); }
  v.srcObject = scanStream; ov.hidden = false; try { await v.play(); } catch (e) {}
  let det;
  try { det = new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e']}); } catch (e) { det = new BarcodeDetector(); }
  let busy = false;
  scanTimer = setInterval(async () => {
    if (busy || v.readyState < 2) return; busy = true;
    try {
      const r = await det.detect(v), c = r.find(x => /^\d{8,14}$/.test(x.rawValue || ''));
      if (c) { stopScan(); const bc = $('#f-bc'); if (bc) bc.value = c.rawValue; toast('Código lido: ' + c.rawValue + '. Procurando seu disco…'); bcSearch(c.rawValue); }
    } catch (e) {}
    busy = false;
  }, 300);
}
function stopScan() {
  clearInterval(scanTimer); scanTimer = null;
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  $('#scan').hidden = true; $('#scanv').srcObject = null;
}
